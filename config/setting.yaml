ui_tips:
- 建议优先使用已拆解完成的 table 目录做通用规则验证。
- Excel 回写会优先写回导出时记录的原始 ini 文件位置。
- 多等级字段可使用 ---- 分隔，也可以用 calc@10+5 快速展开。
- 若要直接选择 .w3x 地图，请先在设置中配置 w2l.exe 路径。
- 输出文件名无需手动输入扩展名，程序会自动补全。
